<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visor · Portfolio de Ingeniería de Requerimientos</title>
  <meta name="theme-color" content="#f6f0eb">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232c2325'/%3E%3Ctext x='16' y='21' font-family='sans-serif' font-size='13' font-weight='600' text-anchor='middle' fill='%23f6f0eb'%3EIR%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=6">
  <style>
    .nav .wrap { gap: var(--s-5); }
    .vt { min-width: 0; flex: 1; }
    .vt h1 { font-size: 20px; line-height: 1.25; letter-spacing: -0.01em; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vt p { font-size: var(--t-label); font-weight: 500; color: var(--p-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #view { padding: calc(var(--nav) + var(--s-6)) 0 var(--s-9); }
    .pages, .vid { width: min(100% - 2 * var(--gut), 880px); margin-inline: auto; display: grid; gap: var(--s-4); }
    .vid { margin-bottom: var(--s-6); }
    .vid video { width: 100%; border-radius: var(--r-md); background: var(--p-ink); display: block; }
    .pages canvas { width: 100%; height: auto; display: block; background: #fff; border-radius: var(--r-sm); border: 1px solid var(--line); }
    .doc { width: min(100% - 2 * var(--gut), 800px); margin-inline: auto; background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-7) var(--s-8); font-size: 16px; line-height: 1.7; }
    .doc h2 { font-size: 32px; line-height: 1.15; letter-spacing: var(--track); margin: 0 0 var(--s-4); }
    .doc h3 { font-size: 20px; line-height: 1.3; font-weight: 500; margin: var(--s-6) 0 var(--s-3); }
    .doc p { margin: 0 0 var(--s-3); }
    .doc table { border-collapse: collapse; width: 100%; font-size: 15px; margin: var(--s-3) 0; }
    .doc td, .doc th { border: 1px solid var(--line-strong); padding: var(--s-2) var(--s-3); vertical-align: top; text-align: left; }
    .doc th { background: var(--p-bg); font-weight: 500; }
    .doc .intro { font-size: var(--t-lead); line-height: 1.5; color: var(--p-muted); margin-bottom: var(--s-5); }
    .doc .note { background: var(--p-bg); border-radius: var(--r-md); padding: var(--s-3) var(--s-4); }
    .doc .note a.pdf { font-weight: 500; }
    .doc ul, .doc ol { padding-left: var(--s-5); }
    .chat { display: grid; gap: var(--s-3); margin-top: var(--s-3); }
    .chat .cmsg { display: grid; gap: var(--s-1); max-width: 86%; }
    .chat .cmsg.me { justify-self: end; }
    .chat .who { font-size: var(--t-label); font-weight: 500; color: var(--p-muted); }
    .chat .me .who { text-align: right; }
    .chat .bubble { padding: var(--s-3) var(--s-4); border-radius: var(--r-md); font-size: 15px; line-height: 1.6; }
    .chat .bot .bubble { background: var(--p-bg); border-top-left-radius: var(--s-1); }
    .chat .me .bubble { background: var(--p-ink); color: var(--p-bg); border-top-right-radius: var(--s-1); }
    .msg { text-align: center; color: var(--p-muted); padding: var(--s-9) var(--s-4); }
    @media (max-width: 639px) { .doc { padding: var(--s-5) var(--s-4); } .vt h1 { font-size: 16px; } .nav .btn--secondary span { display: none; } }
  </style>
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="btn btn--secondary" href="index.html#actividades" aria-label="Volver al portfolio">← <span>Volver</span></a>
      <div class="vt"><p id="k">Cargando…</p><h1 id="ttl"></h1></div>
      <div class="btn-row" id="acts"></div>
    </div>
  </header>
  <main id="view"><p class="msg">Cargando el documento…</p></main>

  <script src="assets/js/data.js?v=6"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
  (async function () {
    const id = new URLSearchParams(location.search).get("id");
    const a = ARTEFACTOS.find((x) => x.id === id);
    const view = document.getElementById("view");
    if (!a) { view.innerHTML = '<p class="msg">No encontré ese trabajo.</p>'; return; }
    const [y, m, d] = a.fecha.split("-");
    document.title = `${a.titulo} · Portfolio de Martín Elola`;
    document.getElementById("k").innerHTML = `Unidad ${a.unidad} · Clase ${a.clase} · ${d}/${m}/${y} · ${a.categoria === "simulacion" ? "Individual, con IA" : a.tipo === "grupal" ? "Grupal" : "Individual"}`;
    document.getElementById("ttl").textContent = a.titulo;
    if (a.doc) document.getElementById("acts").innerHTML = `<a class="btn btn--primary" href="${a.doc}" download>Descargar PDF</a>`;

    if (a.pagina) {
      const r = await fetch(a.pagina);
      view.innerHTML = `<article class="doc">${await r.text()}</article>`;
      document.querySelectorAll('.doc a.pdf').forEach((l) => l.setAttribute('href', a.doc || l.getAttribute('href')));
      return;
    }
    if (!a.doc) { view.innerHTML = '<p class="msg">Este trabajo todavía no está cargado.</p>'; return; }
    const vid = a.video ? `<section class="vid" id="video"><p class="label">Video de la exposición</p><video controls preload="metadata" playsinline poster="${a.poster || ''}" src="${a.video}"></video></section>` : "";
    try {
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const pdf = await pdfjsLib.getDocument(a.doc).promise;
      const wrap = document.createElement("div"); wrap.className = "pages";
      view.innerHTML = vid; view.appendChild(wrap);
      if (location.hash === "#video") document.getElementById("video")?.scrollIntoView();
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        const base = page.getViewport({ scale: 1 });
        const scale = (Math.min(880, wrap.clientWidth || 880) / base.width) * ratio;
        const vp = page.getViewport({ scale });
        const c = document.createElement("canvas");
        c.width = vp.width; c.height = vp.height;
        c.setAttribute("aria-label", `Página ${p} de ${pdf.numPages}`);
        wrap.appendChild(c);
        await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
      }
    } catch (e) {
      view.innerHTML = vid + `<p class="msg">No se pudo mostrar el PDF en el navegador. <a href="${a.doc}">Abrilo o descargalo acá</a>.</p>`;
    }
  })();
  </script>
</body>
</html>
