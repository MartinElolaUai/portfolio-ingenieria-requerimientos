<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visor · Portfolio de Ingeniería de Requerimientos</title>
  <meta name="theme-color" content="#0d0f12">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c9f15d'/%3E%3Ctext x='32' y='41' font-family='monospace' font-size='26' font-weight='700' text-anchor='middle' fill='%2312140f'%3EIR%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=4">
  <style>
    .vbar { position: sticky; top: 0; z-index: 10; background: rgba(13,15,18,.94); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .vbar .wrap { display: flex; align-items: center; gap: 16px; padding-top: 14px; padding-bottom: 14px; max-width: 1100px; }
    .vbar .t { min-width: 0; }
    .vbar .t h1 { font: 400 24px/1.15 var(--serif); margin: 2px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vbar .sp { margin-left: auto; display: flex; gap: 8px; flex: none; }
    .pages { max-width: 920px; margin: 28px auto 80px; padding: 0 16px; display: grid; gap: 18px; }
    .vid { max-width: 920px; margin: 28px auto 0; padding: 0 16px; }
    .vid video { width: 100%; border-radius: 10px; background: #000; display: block; margin-top: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
    .pages canvas { width: 100%; height: auto; display: block; background: #fff; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
    .doc { max-width: 820px; margin: 28px auto 80px; background: #f6f3ec; color: #1b1d20; border-radius: 10px; padding: 48px 56px; box-shadow: 0 10px 40px rgba(0,0,0,.45); font: 16px/1.65 var(--sans); }
    .doc h2 { font: 400 32px/1.15 var(--serif); margin: 28px 0 10px; } .doc h2:first-child { margin-top: 0; }
    .doc h3 { font: 600 17px/1.3 var(--sans); margin: 22px 0 8px; }
    .doc table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 12px 0; }
    .doc td, .doc th { border: 1px solid #c9c3b6; padding: 7px 9px; vertical-align: top; text-align: left; }
    .doc th { background: #ebe5d8; }
    .doc .q { border-left: 3px solid #9bb83a; padding: 4px 0 4px 14px; margin: 14px 0; color: #3a3d41; }
    .doc .intro { font: 400 20px/1.45 var(--serif); color: #4a4d52; margin: 0 0 18px; }
    .doc .note { background: #ebe5d8; border-radius: 8px; padding: 12px 14px; }
    .doc .note a.pdf { color: #12140f; font-weight: 600; }
    .doc ul, .doc ol { padding-left: 22px; }
    .chat { display: grid; gap: 12px; margin-top: 12px; }
    .chat .cmsg { display: grid; gap: 4px; max-width: 86%; }
    .chat .cmsg.me { justify-self: end; text-align: left; }
    .chat .who { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: #7a7d82; }
    .chat .me .who { text-align: right; }
    .chat .bubble { padding: 12px 14px; border-radius: 14px; font-size: 14.5px; line-height: 1.55; }
    .chat .bot .bubble { background: #e6e0d2; border-top-left-radius: 4px; }
    .chat .me .bubble { background: #1b1f25; color: #ebe7df; border-top-right-radius: 4px; }
    .msg { text-align: center; color: var(--muted); padding: 80px 16px; font: 14px var(--mono); }
    @media (max-width: 640px) { .doc { padding: 28px 20px; border-radius: 0; } .vbar .btn span.l { display: none; } }
  </style>
</head>
<body>
  <header class="vbar">
    <div class="wrap">
      <a class="btn" href="index.html#recorrido" aria-label="Volver al portfolio">← <span class="l">Volver</span></a>
      <div class="t"><p class="kicker" id="k">Cargando…</p><h1 id="ttl"></h1></div>
      <div class="sp" id="acts"></div>
    </div>
  </header>
  <main id="view"><p class="msg">Cargando el documento…</p></main>

  <script src="assets/js/data.js?v=4"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
  (async function () {
    const id = new URLSearchParams(location.search).get("id");
    const a = ARTEFACTOS.find((x) => x.id === id);
    const view = document.getElementById("view");
    if (!a) { view.innerHTML = '<p class="msg">No encontré ese trabajo.</p>'; return; }
    const [y, m, d] = a.fecha.split("-");
    document.title = `${a.id} · ${a.titulo}`;
    document.getElementById("k").innerHTML = `${a.id} · Unidad ${a.unidad} · Clase ${a.clase} · ${d}/${m}/${y} · ${a.tipo === "grupal" ? "Grupal" : "Individual"}`;
    document.getElementById("ttl").textContent = a.titulo;
    if (a.doc) document.getElementById("acts").innerHTML = `<a class="btn primary" href="${a.doc}" download>PDF</a>`;

    if (a.pagina) {
      const r = await fetch(a.pagina);
      view.innerHTML = `<article class="doc">${await r.text()}</article>`;
      document.querySelectorAll('.doc a.pdf').forEach((l) => l.setAttribute('href', a.doc || l.getAttribute('href')));
      return;
    }
    if (!a.doc) { view.innerHTML = '<p class="msg">Este trabajo todavía no está cargado.</p>'; return; }
    const vid = a.video ? `<section class="vid" id="video"><p class="kicker">Video de la exposición</p><video controls preload="metadata" playsinline poster="${a.poster || ''}" src="${a.video}"></video></section>` : "";
    try {
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const pdf = await pdfjsLib.getDocument(a.doc).promise;
      const wrap = document.createElement("div"); wrap.className = "pages";
      view.innerHTML = vid; view.appendChild(wrap);
      if (location.hash === "#video") document.getElementById("video")?.scrollIntoView();
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        const base = page.getViewport({ scale: 1 });
        const scale = (Math.min(880, wrap.clientWidth || 880) / base.width) * ratio;
        const vp = page.getViewport({ scale });
        const c = document.createElement("canvas");
        c.width = vp.width; c.height = vp.height;
        c.setAttribute("aria-label", `Página ${p} de ${pdf.numPages}`);
        wrap.appendChild(c);
        await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
      }
    } catch (e) {
      view.innerHTML = vid + `<p class="msg">No se pudo mostrar el PDF en el navegador. <a href="${a.doc}">Abrilo o descargalo acá</a>.</p>`;
    }
  })();
  </script>
</body>
</html>
